services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      STATE_DIR: /state
      INITIAL_SERVERS_FILE: /app/servers.json
      DEFAULT_REQUESTS_FILE: /app/requests.csv
    volumes:
      - type: bind
        source: ./state
        target: /state
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  # Test suite; not started by `up`. Run with
  # `docker compose build tests && docker compose run --rm tests`.
  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    profiles: ["test"]
